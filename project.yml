name: Toss
options:
  bundleIdPrefix: com.ethansoh
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TossCore:
    path: Packages/TossCore
targets:
  Toss-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
    dependencies:
      - package: TossCore
      - target: TossShare-iOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethansoh.toss
        INFOPLIST_FILE: Apps/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Toss-iOS.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Toss-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
      - path: Apps/Shared
    dependencies:
      - package: TossCore
      - target: TossShare-macOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethansoh.toss.mac
        INFOPLIST_FILE: Apps/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Toss-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TossShare-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/iOS
      - path: Extensions/Shared
    dependencies:
      - package: TossCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethansoh.toss.share
        INFOPLIST_FILE: Extensions/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/TossShare-iOS.entitlements
  TossShare-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/macOS
      - path: Extensions/Shared
    dependencies:
      - package: TossCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethansoh.toss.mac.share
        INFOPLIST_FILE: Extensions/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/TossShare-macOS.entitlements
  TossUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TossUITests
    dependencies:
      - target: Toss-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethansoh.toss.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Toss-iOS
schemes:
  Toss-iOS:
    build:
      targets:
        Toss-iOS: all
    run:
      config: Debug
    test:
      targets:
        - TossUITests
  Toss-macOS:
    build:
      targets:
        Toss-macOS: all
    run:
      config: Debug
